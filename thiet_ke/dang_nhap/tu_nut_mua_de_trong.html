<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AVA - Đăng nhập (từ nút Mua) (để trống ô bắt buộc)</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
input:focus{outline:2px solid #2F6B62;border-color:#2F6B62}
.btn:hover{filter:brightness(1.08)}
.bad input,.bad .in,.rbad .rl>div:first-child{border-color:#B3382C!important;background:#FFF8F7!important}.bad input:focus,.bad .in:focus{outline-color:#B3382C!important}
.hh{font-weight:400;font-size:13px;color:#6B8580;line-height:1.45}.hh.er{color:#B3382C;font-weight:500}
</style>

</head>
<body>

<div style="font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#1F3A3D;background:#EEF3F1;width:100%;min-height:760px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">
<div style="position:relative;overflow:hidden;background:#2F6B62;color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px">
<div style="position:absolute;left:-100px;bottom:-140px;width:360px;height:360px;border-radius:50%;background:#3E7D73"></div>
<div style="position:absolute;right:-70px;top:-90px;width:240px;height:240px;border-radius:50%;background:#E9A23B"></div>
<a href="#" style="position:relative;font-weight:800;font-size:28px;display:flex;align-items:center;gap:10px"><svg width="34" height="34" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><circle cx="7" cy="25" r="3" fill="#E9A23B"></circle><path d="M10 25h8a6 6 0 0 0 0-12h-4a5 5 0 0 1 0-10h10"></path></svg>AVA</a>
<div style="position:relative;max-width:440px"><h2 style="font-size:44px;line-height:1.15;font-weight:800;margin:0 0 16px;letter-spacing:-1px">Chào mừng bạn quay lại.</h2><p style="margin:0;font-size:18px;line-height:1.6;color:#E1EEEA">Tiếp tục lộ trình học của bạn từ bài đang dở.</p></div>
<div style="position:relative;font-size:14px;color:#CFE3DD">© [Năm] AVA</div>
</div>
<div style="display:flex;align-items:center;justify-content:center;padding:48px 24px">
<div style="width:100%;max-width:440px;background:#fff;border:1px solid #D9E4E0;border-radius:28px;padding:44px 40px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box">
<div><h1 style="font-size:32px;font-weight:800;margin:0 0 8px;letter-spacing:-0.5px">Đăng nhập</h1><p style="margin:0;color:#3C5558;line-height:1.5">Nhập tên đăng nhập và mật khẩu để vào học.</p></div>
<div style="display:flex;gap:10px;align-items:center;background:#FBE7C2;color:#4A2F05;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:600;line-height:1.4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="flex:none"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>Vui lòng đăng nhập để mua khóa học</div>
<label class="bad" style="display:flex;flex-direction:column;gap:8px;font-weight:600;font-size:14px">Tên đăng nhập<input type="text" placeholder="Tên đăng nhập của bạn" style="height:52px;box-sizing:border-box;border:1px solid #C9D8D3;border-radius:14px;background:#fff;padding:0 16px;font:inherit;font-weight:400;font-size:16px;color:#1F3A3D"><span class="hh er">Vui lòng nhập tên đăng nhập</span></label><label class="bad" style="display:flex;flex-direction:column;gap:8px;font-weight:600;font-size:14px">Mật khẩu<input type="password" inputmode="numeric" maxlength="6" pattern="[0-9]*" placeholder="Mật khẩu" style="height:52px;box-sizing:border-box;border:1px solid #C9D8D3;border-radius:14px;background:#fff;padding:0 16px;font:inherit;font-weight:400;font-size:16px;color:#1F3A3D"><span class="hh er">Vui lòng nhập mật khẩu</span></label><div style="text-align:right;margin-top:-8px"><a href="#" style="font-size:14px;font-weight:600;color:#2F6B62">Quên mật khẩu?</a></div>
<button type="button" class="btn" style="height:54px;border:0;border-radius:999px;background:#2F6B62;color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer;margin-top:4px">Đăng nhập</button>
<div style="text-align:center;color:#3C5558">Chưa có tài khoản? <a href="#" style="font-weight:600;color:#2F6B62">Đăng ký</a></div>
</div>
</div>
</div>
</body>
</html>
